# Local development database. The credentials below are for local use only and the
# port is bound to loopback. Host port 55432 avoids clashing with native PostgreSQL installs (5432, 5433).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: autocv
      POSTGRES_PASSWORD: autocv
      POSTGRES_DB: autocv
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - autocv-db:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autocv -d autocv"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  autocv-db:
